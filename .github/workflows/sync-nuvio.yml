name: Sync Nuvio releases

# Merges each new Nuvio stable release into the stable branch and each new beta into the beta
# branch, keeping the IPTV code, then runs "Release Nuvio + IPTV update" from that branch. A merge conflict
# stops the run and lists the files. Needs the SYNC_TOKEN secret (classic, "repo" and "workflow").
on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  UPSTREAM: NuvioMedia/NuvioTV

concurrency:
  group: sync-nuvio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge and release the newest Nuvio version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          TAGS=$(git ls-remote --tags --refs upstream | sed 's#.*refs/tags/##')
          STABLE_TAG=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$TAGS" | sort -V | tail -1)
          BETA_TAG=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' <<<"$TAGS" | sort -V | tail -1)
          [ -n "$STABLE_TAG" ] && [ -n "$BETA_TAG" ] || { echo "::error::Could not read Nuvio tags"; exit 1; }

          # merge_tag BRANCH TAG: sets MERGED=true when the branch took something new.
          merge_tag() {
          branch="$1"; tag="$2"; MERGED=false
          git fetch --no-tags upstream "+refs/tags/$tag:refs/remotes/upstream/release"
          git checkout -q -B "$branch" "origin/$branch"
          if git merge-base --is-ancestor refs/remotes/upstream/release HEAD; then
            echo "$branch already has Nuvio $tag."
            return 0
          fi
          if ! git merge --no-edit -m "Merge Nuvio $tag" refs/remotes/upstream/release; then
            # Nuvio edited a workflow this fork removed: keep it removed.
            git status --porcelain | sed -n 's#^DU \(\.github/workflows/.*\)#\1#p' | while read -r f; do git rm -q "$f"; done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Nuvio $tag conflicts with the Live TV changes in:"
              git diff --name-only --diff-filter=U | sed 's/^/::error::  /'
              git merge --abort
              exit 1
            fi
            git commit --no-edit
          fi
          # Only this fork's workflows stay, even if Nuvio adds new ones.
          for f in .github/workflows/*; do
            case "$(basename "$f")" in
              sync-nuvio.yml|release-livetv-update.yml|livetv-build.yml) ;;
              *) git rm -q "$f" ;;
            esac
          done
          git diff --cached --quiet || git commit -m "Remove workflows this fork doesn't use"
          git push origin "HEAD:$branch"
          MERGED=true
          }

          release() {
            gh workflow run release-livetv-update.yml -R "$GITHUB_REPOSITORY" --ref "$1" -f notes="Based on Nuvio $2."
          }

          merge_tag stable "$STABLE_TAG"
          if [ "$MERGED" = true ]; then release stable "$STABLE_TAG"; fi
          # Beta always contains the newest stable, then takes any newer beta.
          merge_tag beta "$STABLE_TAG"
          NEWEST=$(printf '%s\n' "$STABLE_TAG-zzz" "$BETA_TAG" | sort -V | tail -1)
          if [ "$NEWEST" = "$BETA_TAG" ]; then
            merge_tag beta "$BETA_TAG"
            if [ "$MERGED" = true ]; then release beta "$BETA_TAG"; fi
          fi
