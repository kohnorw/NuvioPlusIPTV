name: Nightly Nuvio + IPTV

# Every night: merges the newest Nuvio release (betas included) into dev, keeping the Live TV
# code, then builds and publishes a nightly for the app's Nightly update channel. Nothing is
# built when neither Nuvio nor this fork changed. A merge conflict stops the run and lists the
# files; the previous nightly stays available.
#
# Needs the SYNC_TOKEN secret (classic token with "repo" and "workflow" scopes) so the merge can
# be pushed even when Nuvio changed files under .github.
on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: NuvioMedia/NuvioTV
  KEEP_NIGHTLIES: "5"

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the newest Nuvio release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          TAG=$(git ls-remote --tags --refs upstream | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' \
            | sed -E '/-/!s/$/-zzz/' | sort -V | tail -1 | sed 's/-zzz$//')
          [ -n "$TAG" ] || { echo "::error::Could not read Nuvio tags"; exit 1; }
          echo "NUVIO_TAG=$TAG" >> "$GITHUB_ENV"
          git fetch --no-tags upstream "+refs/tags/$TAG:refs/remotes/upstream/release"
          if git merge-base --is-ancestor refs/remotes/upstream/release HEAD; then
            echo "Already on Nuvio $TAG."
          else
            if ! git merge --no-edit -m "Merge Nuvio $TAG" refs/remotes/upstream/release; then
              # Nuvio edited a workflow this fork removed: keep it removed.
              git status --porcelain | sed -n 's#^DU \(\.github/workflows/.*\)#\1#p' | while read -r f; do git rm -q "$f"; done
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "::error::Nuvio $TAG conflicts with the Live TV changes in:"
                git diff --name-only --diff-filter=U | sed 's/^/::error::  /'
                git merge --abort
                exit 1
              fi
              git commit --no-edit
            fi
            # Only this fork's workflows stay, even if Nuvio adds new ones.
            for f in .github/workflows/*; do
              case "$(basename "$f")" in
                nightly-build.yml|release-livetv-update.yml|livetv-build.yml|connect-drive.yml) ;;
                *) git rm -q "$f" ;;
              esac
            done
            git diff --cached --quiet || git commit -m "Remove workflows this fork doesn't use"
            git push origin HEAD:dev
          fi

      - name: Work out the version number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 -E '^\s*versionName = "' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$BASE" ] || { echo "Could not read versionName" >&2; exit 1; }
          if [[ "$BASE" == *-* ]]; then
            PREFIX="$BASE."
            NIGHTLY_PREFIX="${BASE}.nightly."
          else
            IFS=. read -r MA MI PA <<< "$BASE"
            PREFIX="$MA.$MI.$((PA + 1))-livetv."
            NIGHTLY_PREFIX="$MA.$MI.$((PA + 1))-nightly."
          fi
          TAGS=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName')
          LAST_NIGHTLY=$(grep -i 'nightly' <<<"$TAGS" | sort -V | tail -1 || true)
          if [ -n "$LAST_NIGHTLY" ] && [ "$(git rev-list -n1 "refs/tags/$LAST_NIGHTLY" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
            echo "Nothing new since $LAST_NIGHTLY."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One counter across fork betas and nightlies, so versionCode only goes up.
          LAST=$( { grep -F "$PREFIX" <<<"$TAGS" | sed "s/.*\.//"; grep -F "$NIGHTLY_PREFIX" <<<"$TAGS" | sed "s/.*\.//"; } | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          N=$(( ${LAST:-0} + 1 ))
          if [ "$N" -gt 99 ]; then echo "::error::Over 99 fork builds on Nuvio $BASE"; exit 1; fi
          echo "version=$NIGHTLY_PREFIX$N" >> "$GITHUB_OUTPUT"
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip != 'true'
        name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - if: steps.version.outputs.skip != 'true'
        name: Write app keys
        env:
          # Falls back to Nuvio's public server and publishable key (the same ones nuvio-bridge uses).
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL || 'https://api.nuvio.tv' }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          # IMDb ratings (episode ratings and the rating on details pages) come from Nuvio's
          # ratings services; without these the app has nowhere to ask, so no ratings show.
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          # Skip intro: IntroDB (introdb.app), a free and open timestamp service (no key needed to
          # read). A secret can point it elsewhere; otherwise the public address is used.
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > keys.properties
          add() { if [ -n "$2" ]; then echo "$1=$2" >> keys.properties; fi; }
          if [ -n "$NUVIO_BACKEND_URL" ]; then
            BACKEND="${NUVIO_BACKEND_URL%/}"
            add NUVIO_SUPABASE_URL "$BACKEND"
            add NUVIO_SUPABASE_ANON_KEY "$NUVIO_BACKEND_KEY"
            case "$BACKEND" in
              *api.nuvio.tv*)
                # Official Nuvio accounts: the app's built-in nuvio.tv login pages are already right.
                ;;
              *)
                # Self-hosted server: its login pages live on the server itself.
                add TV_LOGIN_WEB_BASE_URL "$BACKEND/tv-login"
                add DEVICE_LOGIN_WEB_BASE_URL "$BACKEND/link"
                add AVATAR_PUBLIC_BASE_URL "$BACKEND/storage/v1/object/public/avatars"
                ;;
            esac
          fi
          add TMDB_API_KEY "$TMDB_API_KEY"
          add TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          add TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          add SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          add SIMKL_APP_NAME "$SIMKL_APP_NAME"
          add MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          add PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          add IMDB_RATINGS_API_BASE_URL "$IMDB_RATINGS_API_BASE_URL"
          add IMDB_TAPFRAME_API_BASE_URL "$IMDB_TAPFRAME_API_BASE_URL"
          add INTRODB_API_URL "${INTRODB_API_URL:-https://api.introdb.app/}"
          # The build reads some values from each file, so write both.
          cp keys.properties local.properties
          cp keys.properties local.dev.properties
          rm keys.properties
          echo "Keys set:"; cut -d= -f1 local.properties

      - if: steps.version.outputs.skip != 'true'
        name: Signing
        run: |
          cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - if: steps.version.outputs.skip != 'true'
        name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:testFullReleaseUnitTest --tests '*ReleaseSelectorTest' :app:assembleFullRelease --stacktrace \
            -PlivetvBuildNumber=${{ steps.version.outputs.number }} \
            -PlivetvVersionName=${{ steps.version.outputs.version }}

      - if: steps.version.outputs.skip != 'true'
        name: Collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          for f in $(find app/build/outputs/apk/full/release -name "*.apk"); do
            name=$(basename "$f" .apk)
            cp "$f" "out/NuvioPlusIPTV-$VERSION-${name#app-full-}.apk"
          done
          git rev-parse HEAD > sha.txt

      - if: steps.version.outputs.skip != 'true'
        name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" out/*.apk -R "$GITHUB_REPOSITORY" --target "$(cat sha.txt)" \
            --title "Nuvio + IPTV Nightly $VERSION" --prerelease --latest=false \
            --notes "Automatic nightly based on Nuvio $NUVIO_TAG, with Live TV included. Least tested channel."
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep -i nightly | sort -Vr | tail -n +$((KEEP_NIGHTLIES + 1)) \
            | while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
